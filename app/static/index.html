<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --bg-sidebar:#F6F7F9; --surface:#FFFFFF; --surface-2:#F3F4F7;
  --border:#E4E7EC; --border-soft:#EEF0F3;
  --text:#171B23; --text-soft:#5B6472; --text-faint:#98A1AE;
  --accent:#21548C; --accent-soft:#E8F0F9; --accent-strong:#153A64;
  --good:#1E8E5A; --good-bg:#E6F5EE;
  --warn:#B7791F; --warn-bg:#FCF3E3;
  --crit:#C0362C; --crit-bg:#FBEAE8;
  --neutral:#8A93A3; --neutral-bg:#EEF0F3;
  --shadow: 0 1px 2px rgba(20,24,32,.04), 0 8px 24px -12px rgba(20,24,32,.10);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --bg-sidebar:#0E1015; --surface:#181C24; --surface-2:#1E232C;
    --border:#2B303B; --border-soft:#242830;
    --text:#EDEFF3; --text-soft:#A6ADBA; --text-faint:#6B7280;
    --accent:#5B9BD9; --accent-soft:#1B2A3C; --accent-strong:#8FC0EE;
    --good:#3FBE85; --good-bg:#12291F;
    --warn:#E0A93C; --warn-bg:#2E2510;
    --crit:#E2645A; --crit-bg:#341814;
    --neutral:#8A93A3; --neutral-bg:#232732;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --bg-sidebar:#0E1015; --surface:#181C24; --surface-2:#1E232C;
  --border:#2B303B; --border-soft:#242830;
  --text:#EDEFF3; --text-soft:#A6ADBA; --text-faint:#6B7280;
  --accent:#5B9BD9; --accent-soft:#1B2A3C; --accent-strong:#8FC0EE;
  --good:#3FBE85; --good-bg:#12291F;
  --warn:#E0A93C; --warn-bg:#2E2510;
  --crit:#E2645A; --crit-bg:#341814;
  --neutral:#8A93A3; --neutral-bg:#232732;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Public Sans",-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;letter-spacing:-0.01em;margin:0}
a{color:inherit}
button{font-family:inherit}
[hidden]{display:none!important}

/* ---------- Login ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 500px at 15% -10%, var(--accent-soft), transparent), var(--bg);}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:36px 32px;}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.login-brand .name{font-weight:700;font-size:16px}
.login-card h1{font-size:20px;margin-bottom:6px}
.login-card p.sub{color:var(--text-soft);margin:0 0 24px;font-size:13.5px}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.ms-btn:hover{background:var(--surface-2)}
.ms-grid{width:16px;height:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px}
.ms-grid span{display:block}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:12px;margin:20px 0}
.login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--border)}
.dev-login-list{display:flex;flex-direction:column;gap:6px}
.dev-login-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border-soft);background:var(--surface);cursor:pointer;text-align:left;font-size:13.5px}
.dev-login-item:hover{background:var(--surface-2);border-color:var(--border)}
.login-note{margin-top:20px;font-size:12px;color:var(--text-faint);line-height:1.5}

/* ---------- App shell ---------- */
#appShell{display:none;grid-template-columns:232px 1fr;min-height:100vh}
#appShell.active{display:grid}
.sidebar{background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 18px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.brand .name{font-weight:700;font-size:14.5px}
.nav-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-soft);font-weight:500;font-size:13.5px}
.nav-item .ico{width:17px;height:17px;flex:none;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex:none}
.user-chip .who{overflow:hidden}
.user-chip .who .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who .t{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;border:none;background:transparent;color:var(--text-soft);font-size:12.5px;cursor:pointer;text-align:left}
.foot-btn:hover{background:var(--surface-2);color:var(--text)}

.content{padding:26px 32px 80px;max-width:1280px}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-head h1{font-size:21px}
.page-head .sub{color:var(--text-soft);font-size:13px;margin-top:2px}

/* ---------- Cards / grid ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-card .label{font-size:12px;color:var(--text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat-card .value{font-size:26px;font-weight:800;margin-top:6px;font-family:"IBM Plex Mono",monospace}
.stat-card .foot{font-size:12px;color:var(--text-faint);margin-top:4px}

.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:22px}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.panel-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.panel-title .hint{font-size:11.5px;color:var(--text-faint);font-weight:500}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px 10px;border-bottom:1px solid var(--border-soft);font-size:13.5px;vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.rank{color:var(--text-faint);font-size:12px;width:20px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.crit{background:var(--crit-bg);color:var(--crit)}
.rate-bar{height:6px;border-radius:4px;background:var(--neutral-bg);overflow:hidden;width:84px}
.rate-bar > div{height:100%;border-radius:4px}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tag.required{background:var(--accent-soft);color:var(--accent-strong)}
.tag.optional{background:var(--neutral-bg);color:var(--neutral)}

.empty-note{color:var(--text-faint);font-size:13px;padding:18px 4px}

/* ---------- Filters ---------- */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar input[type=text], .filter-bar select{
  padding:8px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:13px;font-family:inherit;
}
.filter-bar input[type=text]{min-width:200px}
.chip-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.chip-toggle button{padding:8px 12px;border:none;background:var(--surface);color:var(--text-soft);font-size:12.5px;font-weight:600;cursor:pointer;border-right:1px solid var(--border)}
.chip-toggle button:last-child{border-right:none}
.chip-toggle button.active{background:var(--accent);color:#fff}
.group-heading{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);margin:18px 0 6px;padding-top:6px}

/* ---------- Team ---------- */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.person-card:hover{border-color:var(--accent)}
.person-card .top{display:flex;align-items:center;gap:10px}
.person-card .info .n{font-weight:700;font-size:13.5px}
.person-card .info .t{font-size:12px;color:var(--text-faint)}

/* ---------- Org chart ---------- */
.orgchart-wrap{overflow-x:auto;padding:10px 4px 30px}
.org-tree, .org-tree ul{list-style:none;margin:0;padding:0}
.org-tree{display:flex;justify-content:center}
.org-tree ul{display:flex;padding-top:28px;position:relative}
.org-tree li{display:flex;flex-direction:column;align-items:center;padding:0 14px;position:relative}
.org-tree li::before{content:"";position:absolute;top:0;left:50%;width:1px;height:14px;background:var(--border)}
.org-tree > li::before{display:none}
.org-tree ul::before{content:"";position:absolute;top:14px;left:0;right:0;height:1px;background:var(--border)}
.org-tree ul.single::before{display:none}
.org-node{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:150px;text-align:center;cursor:pointer;position:relative;z-index:1}
.org-node:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.org-node .n{font-weight:700;font-size:13px}
.org-node .t{font-size:11px;color:var(--text-faint);margin:2px 0 8px}

/* ---------- Modal / slide-over ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,18,24,.45);display:none;z-index:40}
.scrim.active{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:92vw;max-height:86vh;overflow:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:41;display:none;padding:22px}
.modal.active{display:block}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:18px;line-height:1}
.panel{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;background:var(--surface);border-left:1px solid var(--border);
  box-shadow:-8px 0 30px -12px rgba(20,24,32,.25);z-index:41;transform:translateX(100%);transition:transform .18s ease;overflow-y:auto;padding:22px}
.panel.active{transform:translateX(0)}

.occ-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.occ-row:last-child{border-bottom:none}
.occ-date{font-size:12.5px;color:var(--text-soft);font-family:"IBM Plex Mono",monospace}
.attendee-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:999px;font-size:11.5px;font-weight:600;margin:2px 3px 2px 0}
.attendee-pill .dot{width:7px;height:7px;border-radius:50%;flex:none}
.attendee-pill.present{background:var(--good-bg);color:var(--good)}
.attendee-pill.present .dot{background:var(--good)}
.attendee-pill.absent-required{background:var(--crit-bg);color:var(--crit)}
.attendee-pill.absent-required .dot{background:var(--crit)}
.attendee-pill.absent-optional{background:var(--neutral-bg);color:var(--neutral);opacity:.85}
.attendee-pill.absent-optional .dot{background:var(--neutral);border:1px dashed var(--neutral)}

/* ---------- Chat ---------- */
#chatFab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;
  border:none;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:35}
#chatFab svg{width:22px;height:22px}
#chatPanel{position:fixed;bottom:86px;right:22px;width:360px;max-width:92vw;height:480px;max-height:70vh;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:36;display:none;flex-direction:column;overflow:hidden}
#chatPanel.active{display:flex}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-head .title{font-weight:700;font-size:13.5px}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:3px}
.msg.pending{color:var(--text-faint);font-style:italic}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.chat-input-row input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px}
.chat-input-row button{padding:9px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.chat-suggestions button{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-soft);font-size:11.5px;cursor:pointer}
.chat-suggestions button:hover{background:var(--surface-2)}
#chatPage .chat-messages{height:calc(100vh - 260px)}
#chatPage .chat-shell{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.chat-empty{margin:auto;text-align:center;color:var(--text-faint);font-size:13px;max-width:280px}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <div class="login-brand"><div class="mark">MC</div><div class="name">Meeting Compliance</div></div>
    <h1>Sign in</h1>
    <p class="sub">Track Teams meeting attendance across your org.</p>
    <button class="ms-btn" id="msSignInBtn">
      <span class="ms-grid"><span style="background:#F25022"></span><span style="background:#7FBA00"></span><span style="background:#00A4EF"></span><span style="background:#FFB900"></span></span>
      Sign in with Microsoft
    </button>
    <div id="devLoginBlock" hidden>
      <div class="login-divider">or, dev sign-in</div>
      <div class="dev-login-list" id="devLoginList"></div>
    </div>
    <p class="login-note" id="loginNote"></p>
  </div>
</div>

<div id="appShell">
  <div class="sidebar">
    <div class="brand"><div class="mark">MC</div><div class="name">Meeting Compliance</div></div>
    <ul class="nav-list">
      <li class="nav-item" data-view="dashboard"><span class="ico">▦</span>Dashboard</li>
      <li class="nav-item" data-view="meetings"><span class="ico">◔</span>Meetings</li>
      <li class="nav-item" data-view="team"><span class="ico">◎</span>Team</li>
      <li class="nav-item" data-view="orgchart"><span class="ico">⌂</span>Org Chart</li>
      <li class="nav-item" data-view="chat"><span class="ico">✦</span>Assistant</li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="sbAvatar">--</div>
        <div class="who"><div class="n" id="sbName">—</div><div class="t" id="sbTitle">—</div></div>
      </div>
      <button class="foot-btn" id="themeToggleBtn">🌓 Toggle dark mode</button>
      <button class="foot-btn" id="logoutBtn">↩ Sign out</button>
    </div>
  </div>

  <div class="content">
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-meetings" hidden></section>
    <section class="view" id="view-team" hidden></section>
    <section class="view" id="view-orgchart" hidden></section>
    <section class="view" id="view-chat" hidden></section>
  </div>
</div>

<button id="chatFab" title="Ask the assistant" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.5 8.5 0 0 1-4-.94L3 20l1.06-3.6a8.4 8.4 0 0 1-.9-3.9A8.4 8.4 0 0 1 11.6 4a8.4 8.4 0 0 1 8.4 7.5Z"/></svg>
</button>
<div id="chatPanel">
  <div class="chat-head"><div class="title">Meeting Compliance Assistant</div><button class="modal-close" id="chatPanelClose">✕</button></div>
  <div class="chat-messages" id="chatPanelMessages"></div>
  <div class="chat-input-row">
    <input type="text" id="chatPanelInput" placeholder="Ask about attendance…" />
    <button id="chatPanelSend">Send</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="personModal">
  <button class="modal-close" id="personModalClose">✕</button>
  <div id="personModalBody"></div>
</div>
<div class="panel" id="meetingPanel">
  <button class="modal-close" id="meetingPanelClose">✕</button>
  <div id="meetingPanelBody"></div>
</div>

<script>
const API = "";
let state = {
  me: null,
  view: "dashboard",
  authMode: "dev",
  directory: [],
  chatHistory: [],
  charts: {},
};

/* ---------- utils ---------- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ return (name||"?").split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }
function pct(rate){ return rate == null ? "—" : Math.round(rate*100) + "%"; }
function rateClass(rate){ if(rate==null) return "warn"; if(rate>=0.9) return "good"; if(rate>=0.75) return "warn"; return "crit"; }
function rateColor(rate){ return getComputedStyle(document.documentElement).getPropertyValue(
  rate==null?"--neutral":rate>=0.9?"--good":rate>=0.75?"--warn":"--crit").trim(); }
function fmtDate(iso){ return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function fmtWeek(iso){ return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

async function api(path, opts={}){
  const res = await fetch(API+path, {credentials:"same-origin", headers:{"Content-Type":"application/json"}, ...opts});
  if(res.status === 401){ showLogin(); throw new Error("unauthorized"); }
  if(!res.ok){ throw new Error((await res.json().catch(()=>({detail:res.statusText}))).detail || res.statusText); }
  return res.status === 204 ? null : res.json();
}

/* ---------- theme ---------- */
function initTheme(){
  try{
    const saved = localStorage.getItem("mc-theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur === "dark" ? "light" : cur === "light" ? (dark?"dark":"light") : (dark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("mc-theme", next); }catch(e){}
  Object.values(state.charts).forEach(c => c && c.update());
}

/* ---------- auth / boot ---------- */
async function boot(){
  initTheme();
  const cfg = await fetch(API+"/auth/config").then(r=>r.json()).catch(()=>({mode:"dev"}));
  state.authMode = cfg.mode;
  try{
    state.me = await api("/auth/me");
    state.directoryCache = await api("/directory/users").catch(()=>[]);
    showApp();
  }catch(e){
    showLogin();
  }
}

async function showLogin(){
  document.getElementById("loginView").style.display = "flex";
  document.getElementById("appShell").classList.remove("active");
  document.getElementById("chatFab").hidden = true;
  document.getElementById("msSignInBtn").onclick = () => { window.location.href = "/auth/login"; };
  const cfg = await fetch(API+"/auth/config").then(r=>r.json()).catch(()=>({mode:"dev", microsoft_configured:false}));
  if(!cfg.microsoft_configured){
    document.getElementById("loginNote").textContent = "Microsoft sign-in isn't configured for this environment yet — use dev sign-in below, or see HELPDESK_EMAIL_DRAFT.md to request Azure AD app credentials.";
  }
  if(cfg.mode === "dev"){
    const dir = await fetch(API+"/auth/dev-login-directory").then(r=>r.ok?r.json():[]).catch(()=>[]);
    // Fallback directory if the (optional) listing endpoint isn't present.
    const people = dir.length ? dir : [
      {email:"lead@corp.com", name:"Jordan Lee", title:"Engineering Lead"},
      {email:"pm@corp.com", name:"Priya Menon", title:"Program Manager"},
      {email:"alice@corp.com", name:"Alice Chen", title:"Software Engineer"},
      {email:"taylor@corp.com", name:"Taylor Brooks", title:"VP Engineering"},
    ];
    const list = document.getElementById("devLoginList");
    list.innerHTML = people.map(p => `<button class="dev-login-item" data-email="${esc(p.email)}">
      <div class="avatar" style="width:22px;height:22px;font-size:10px">${esc(initials(p.name))}</div>
      <div><b>${esc(p.name)}</b> <span style="color:var(--text-faint)">— ${esc(p.title||"")}</span></div>
    </button>`).join("");
    list.querySelectorAll(".dev-login-item").forEach(btn => {
      btn.onclick = () => { window.location.href = "/auth/dev-login?email="+encodeURIComponent(btn.dataset.email); };
    });
    document.getElementById("devLoginBlock").hidden = false;
  }
}

function showApp(){
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appShell").classList.add("active");
  document.getElementById("chatFab").hidden = false;
  document.getElementById("sbAvatar").textContent = initials(state.me.name);
  document.getElementById("sbName").textContent = state.me.name;
  document.getElementById("sbTitle").textContent = state.me.title || state.me.email;
  setView("dashboard");
}

document.getElementById("logoutBtn").onclick = async () => {
  await fetch(API+"/auth/logout", {method:"POST"});
  location.reload();
};
document.getElementById("themeToggleBtn").onclick = toggleTheme;

/* ---------- nav / view routing ---------- */
document.querySelectorAll(".nav-item").forEach(el => el.onclick = () => setView(el.dataset.view));
function setView(name){
  state.view = name;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view===name));
  document.querySelectorAll(".view").forEach(el => el.hidden = el.id !== "view-"+name);
  const renderers = {dashboard: renderDashboard, meetings: renderMeetings, team: renderTeam, orgchart: renderOrgChart, chat: renderChatPage};
  renderers[name]();
}

/* ---------- Dashboard ---------- */

  el.innerHTML = `<div class="page-head"><div><h1>Dashboard</h1><div class="sub">Your meeting attendance at a glance</div></div></div>
    <div id="dashStats" class="stat-grid"></div>
    <div class="two-col">
      <div class="card"><div class="panel-title">Attendance trend <span class="hint">required meetings, weekly</span></div><canvas id="trendChart" height="150"></canvas></div>
      <div class="card"><div class="panel-title">My required meetings</div><canvas id="myPieChart" height="150"></canvas></div>
    </div>
    <div class="two-col">
      <div class="card"><div class="panel-title">Meetings needing attention</div><div id="concernTable"></div></div>
      <div class="card"><div class="panel-title">People to focus on</div><div id="focusTable"></div></div>

    <div class="card stat-card"><div class="label">Direct reports</div><div class="value">${d.direct_report_count}</div><div class="foot">${d.total_report_count} total in your org</div></div>
    <div class="card stat-card"><div class="label">Team attendance rate</div><div class="value" style="color:${d.team?rateColor(d.team.attendance_rate):'var(--text-faint)'}">${d.team?pct(d.team.attendance_rate):"—"}</div><div class="foot">${d.team?d.team.attended+"/"+d.team.total+" required meetings":"No direct reports"}</div></div>
    <div class="card stat-card"><div class="label">Open concerns</div><div class="value">${d.top_concern_series.length}</div><div class="foot">meeting series with a required miss</div></div>`;

  const trendCtx = document.getElementById("trendChart");

  state.charts.trend = new Chart(trendCtx, {
    type: "line",
    data: { labels: d.trend.map(t=>fmtWeek(t.week_start)), datasets: [{
      label:"Attendance rate", data: d.trend.map(t=>Math.round((t.attendance_rate||0)*100)),
      borderColor: getComputedStyle(document.documentElement).getPropertyValue("--accent"),

    options: { plugins:{legend:{display:false}}, scales:{ y:{min:0,max:100, ticks:{callback:v=>v+"%"}, grid:{color:getComputedStyle(document.documentElement).getPropertyValue("--border-soft")}}, x:{grid:{display:false}} } }
  });

/* ---------- Meetings ---------- */
let meetingsFilterState = { search:"", recurrence:"", groupBy:"" };
async function renderMeetings(){
  const el = document.getElementById("view-meetings");
  el.innerHTML = `<div class="page-head"><div><h1>Meetings</h1><div class="sub">Every series you or your reports are expected at</div></div></div>
    <div class="filter-bar">
      <input type="text" id="mSearch" placeholder="Search meetings…" value="${esc(meetingsFilterState.search)}"/>
      <select id="mRecurrence">
        <option value="">All types</option>
        <option value="once">One-time</option>
        <option value="daily">Recurring</option>
      </select>
      <div class="chip-toggle">
        <button data-g="" class="${meetingsFilterState.groupBy===""?"active":""}">Flat</button>
        <button data-g="organizer" class="${meetingsFilterState.groupBy==="organizer"?"active":""}">Group by organizer</button>
      </div>
    </div>
    <div id="meetingsList"></div>`;
  document.getElementById("mRecurrence").value = meetingsFilterState.recurrence;
  document.getElementById("mSearch").oninput = debounce(e => { meetingsFilterState.search = e.target.value; loadMeetings(); }, 300);
  document.getElementById("mRecurrence").onchange = e => { meetingsFilterState.recurrence = e.target.value; loadMeetings(); };
  el.querySelectorAll(".chip-toggle button").forEach(b => b.onclick = () => { meetingsFilterState.groupBy = b.dataset.g; loadMeetings(); });
  await loadMeetings();
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function meetingRow(m, rank){
  return `<tr class="clickable" data-series="${m.series_id}">
    <td class="rank">${rank!=null?rank+1:""}</td>
    <td><b>${esc(m.title)}</b><div style="color:var(--text-faint);font-size:11.5px">${m.recurrence==="once"?"One-time":"Recurring"} · ${m.required_total} required-attendee slots</div></td>
    <td>${esc(displayName(m.organizer_email))}</td>
    <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${fmtDate(m.last_occurrence)}</td>
    <td><div style="display:flex;align-items:center;gap:8px"><div class="rate-bar"><div style="width:${Math.round((m.attendance_rate||0)*100)}%;background:${rateColor(m.attendance_rate)}"></div></div><span class="badge ${rateClass(m.attendance_rate)}">${pct(m.attendance_rate)}</span></div></td>
  </tr>`;
}
async function loadMeetings(){
  const params = new URLSearchParams();
  if(meetingsFilterState.search) params.set("search", meetingsFilterState.search);
  if(meetingsFilterState.recurrence) params.set("recurrence", meetingsFilterState.recurrence);
  if(meetingsFilterState.groupBy) params.set("group_by", meetingsFilterState.groupBy);
  const data = await api("/meetings?"+params.toString());
  const host = document.getElementById("meetingsList");
  const head = `<thead><tr><th></th><th>Meeting</th><th>Organizer</th><th>Last occurrence</th><th>Attendance</th></tr></thead>`;
  if(data.grouped_by === "organizer"){
    const groups = Object.entries(data.groups);
    host.innerHTML = groups.length ? groups.map(([org, items]) => `
      <div class="group-heading">${esc(displayName(org))} · ${items.length} meeting${items.length===1?"":"s"}</div>
      <table>${head}<tbody>${items.map((m,i)=>meetingRow(m,i)).join("")}</tbody></table>
    `).join("") : `<div class="empty-note">No meetings match your filters.</div>`;
  } else {
    host.innerHTML = data.items.length ? `<table>${head}<tbody>${data.items.map((m,i)=>meetingRow(m,i)).join("")}</tbody></table>` : `<div class="empty-note">No meetings match your filters.</div>`;
  }
  host.querySelectorAll("tr[data-series]").forEach(r => r.onclick = () => openMeetingPanel(r.dataset.series));
}

async function openMeetingPanel(seriesId){
  const m = await api("/meetings/"+seriesId);
  document.getElementById("meetingPanelBody").innerHTML = `
    <h2 style="margin-bottom:2px">${esc(m.title)}</h2>
    <div style="color:var(--text-soft);font-size:13px;margin-bottom:18px">Organized by ${esc(displayName(m.organizer_email))} · ${m.recurrence==="once"?"one-time":"recurring"}</div>
    ${m.occurrences.slice().reverse().map(occ => `
      <div style="margin-bottom:16px">
        <div class="occ-date" style="margin-bottom:8px">${fmtDate(occ.start_time)} – ${new Date(occ.end_time).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div>
        <div>${occ.attendances.map(a => {
          const cls = a.attended ? "present" : (a.required ? "absent-required" : "absent-optional");
          const label = a.attended ? "present" : "absent";
          return `<span class="attendee-pill ${cls}"><span class="dot"></span>${esc(a.name)} · ${label}${!a.required?" (optional)":""}</span>`;
        }).join("")}</div>
      </div>`).join("")}
  `;
  openPanel("meetingPanel");
}

/* ---------- Team ---------- */
async function renderTeam(){
  const el = document.getElementById("view-team");
  el.innerHTML = `<div class="page-head"><div><h1>Team</h1><div class="sub">You and everyone reporting to you</div></div></div>
    <div class="filter-bar">
      <input type="text" id="tSearch" placeholder="Search people…"/>
      <div class="chip-toggle">
        <button data-s="rate-asc" class="active">Lowest rate first</button>
        <button data-s="name">Name</button>
      </div>
    </div>
    <div id="peopleGrid" class="people-grid"></div>`;
  const people = await api("/people");
  let sort = "rate-asc", search = "";
  function draw(){
    let list = people.filter(p => (p.name+p.email+p.title).toLowerCase().includes(search.toLowerCase()));
    list = list.slice().sort((a,b) => sort==="name" ? a.name.localeCompare(b.name) : (a.attendance_rate??1)-(b.attendance_rate??1));
    document.getElementById("peopleGrid").innerHTML = list.map(p => `
      <div class="person-card" data-email="${esc(p.email)}">
        <div class="top"><div class="avatar">${esc(initials(p.name))}</div><div class="info"><div class="n">${esc(p.name)}${p.is_self?" (you)":""}</div><div class="t">${esc(p.title)}</div></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="rate-bar" style="flex:1;margin-right:10px"><div style="width:${Math.round((p.attendance_rate||0)*100)}%;background:${rateColor(p.attendance_rate)}"></div></div>
          <span class="badge ${rateClass(p.attendance_rate)}">${pct(p.attendance_rate)}</span>
        </div>
      </div>`).join("") || `<div class="empty-note">No one matches your search.</div>`;
    document.querySelectorAll(".person-card").forEach(c => c.onclick = () => openPersonModal(c.dataset.email));
  }
  document.getElementById("tSearch").oninput = e => { search = e.target.value; draw(); };
  el.querySelectorAll(".chip-toggle button").forEach(b => b.onclick = () => {
    el.querySelectorAll(".chip-toggle button").forEach(x=>x.classList.remove("active")); b.classList.add("active");
    sort = b.dataset.s; draw();
  });
  draw();
}

/* ---------- Org chart ---------- */
async function renderOrgChart(){
  const el = document.getElementById("view-orgchart");
  el.innerHTML = `<div class="page-head"><div><h1>Org Chart</h1><div class="sub">Click (or hover) anyone to see their attendance breakdown</div></div></div>
    <div class="orgchart-wrap"><ul class="org-tree" id="orgTreeRoot"></ul></div>`;
  const tree = await api("/orgchart");
  document.getElementById("orgTreeRoot").innerHTML = `<li>${orgNodeHTML(tree)}</li>`;
  el.querySelectorAll(".org-node").forEach(n => {
    let hoverTimer;
    n.addEventListener("mouseenter", () => { hoverTimer = setTimeout(()=>openPersonModal(n.dataset.email), 350); });
    n.addEventListener("mouseleave", () => clearTimeout(hoverTimer));
    n.addEventListener("click", () => openPersonModal(n.dataset.email));
  });
}
function orgNodeHTML(node){
  const rate = node.required_total ? `<span class="badge ${rateClass(node.attendance_rate)}" style="font-size:10.5px;padding:2px 7px">${pct(node.attendance_rate)}</span>` : "";
  const children = node.children && node.children.length ? `<ul class="${node.children.length===1?'single':''}">${node.children.map(c=>`<li>${orgNodeHTML(c)}</li>`).join("")}</ul>` : "";
  return `<div class="org-node" data-email="${esc(node.email)}"><div class="n">${esc(node.name)}</div><div class="t">${esc(node.title)}</div>${rate}</div>${children}`;
}

/* ---------- Chat (shared logic for FAB panel + dedicated page) ---------- */
function chatBubbleHTML(m){
  return `<div class="msg ${m.role}">${esc(m.content)}</div>`;
}
async function sendChat(input, host, useHistory){
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  state.chatHistory.push({role:"user", content:text});
  host.insertAdjacentHTML("beforeend", chatBubbleHTML({role:"user", content:text}));
  host.insertAdjacentHTML("beforeend", `<div class="msg assistant pending" id="pendingMsg">Thinking…</div>`);
  host.scrollTop = host.scrollHeight;
  try{
    const res = await api("/chat", { method:"POST", body: JSON.stringify({ message:text, history: useHistory ? state.chatHistory.slice(0,-1) : [] }) });
    document.getElementById("pendingMsg")?.remove();
    state.chatHistory.push({role:"assistant", content:res.reply});
    host.insertAdjacentHTML("beforeend", chatBubbleHTML({role:"assistant", content:res.reply}));
  }catch(e){
    document.getElementById("pendingMsg")?.remove();
    host.insertAdjacentHTML("beforeend", chatBubbleHTML({role:"assistant", content: "⚠ "+(e.message.includes("ANTHROPIC")?"The assistant isn't configured yet (missing API key).":e.message) }));
  }
  host.scrollTop = host.scrollHeight;
}
document.getElementById("chatFab").onclick = () => {
  document.getElementById("chatPanel").classList.add("active");
  const msgs = document.getElementById("chatPanelMessages");
  if(!msgs.childElementCount) msgs.innerHTML = state.chatHistory.map(chatBubbleHTML).join("") || `<div class="chat-empty">Ask me things like "who's missing standup" or "how is Carol doing".</div>`;
};
document.getElementById("chatPanelClose").onclick = () => document.getElementById("chatPanel").classList.remove("active");
document.getElementById("chatPanelSend").onclick = () => sendChat(document.getElementById("chatPanelInput"), document.getElementById("chatPanelMessages"), true);
document.getElementById("chatPanelInput").addEventListener("keydown", e => { if(e.key==="Enter") sendChat(e.target, document.getElementById("chatPanelMessages"), true); });

function renderChatPage(){
  const el = document.getElementById("view-chat");
  el.innerHTML = `<div class="page-head"><div><h1>Assistant</h1><div class="sub">Ask about attendance across your meetings and team</div></div></div>
    <div class="chat-shell" style="height:calc(100vh - 200px)">
      <div class="chat-messages" id="chatPageMessages">${state.chatHistory.length ? state.chatHistory.map(chatBubbleHTML).join("") : `<div class="chat-empty">Try: "Who has the worst attendance on my team?" or "What's the deal with the Q4 kickoff?"</div>`}</div>
      <div class="chat-suggestions">
        <button data-q="Which meetings need my attention right now?">Meetings needing attention</button>
        <button data-q="Who on my team has missed the most required meetings?">Who's missing meetings?</button>
        <button data-q="How is my own attendance looking?">My attendance</button>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatPageInput" placeholder="Ask about attendance…"/>
        <button id="chatPageSend">Send</button>
      </div>
    </div>`;
  const input = document.getElementById("chatPageInput");
  const host = document.getElementById("chatPageMessages");
  document.getElementById("chatPageSend").onclick = () => sendChat(input, host, true);
  input.addEventListener("keydown", e => { if(e.key==="Enter") sendChat(input, host, true); });
  el.querySelectorAll(".chat-suggestions button").forEach(b => b.onclick = () => { input.value = b.dataset.q; sendChat(input, host, true); });
}

/* ---------- modal/panel plumbing ---------- */
function openModal(id){ document.getElementById("scrim").classList.add("active"); document.getElementById(id).classList.add("active"); }
function openPanel(id){ document.getElementById("scrim").classList.add("active"); document.getElementById(id).classList.add("active"); }
function closeOverlays(){
  document.getElementById("scrim").classList.remove("active");
  document.querySelectorAll(".modal, .panel").forEach(m => m.classList.remove("active"));
}
document.getElementById("scrim").onclick = closeOverlays;
document.getElementById("personModalClose").onclick = closeOverlays;
document.getElementById("meetingPanelClose").onclick = closeOverlays;

function displayName(email){
  const hit = (state.directoryCache||[]).find(p=>p.email===email);
  return hit ? hit.name : email;
}

boot();
