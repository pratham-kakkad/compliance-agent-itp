<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Encop — Compliance Platform</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Decide before first paint whether the intro splash plays this session (once per tab, never for reduced motion).
      (function () {
        try {
          var d = document.documentElement;
          var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var seen = false;
          try { seen = sessionStorage.getItem("ic-splash-seen") === "1"; } catch (e) {}
          d.dataset.splash = reduce || seen ? "skip" : "on";
        } catch (e) { document.documentElement.dataset.splash = "off"; }
      })();
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var m = localStorage.getItem("mc-theme");
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches); // light by default
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
