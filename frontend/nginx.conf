# Frontend container: serves the built SPA at /ui/ and reverse-proxies every
# other path (the FastAPI API, /auth/* including the Microsoft callback,
# /docs, /health) to the backend service. The browser only ever talks to this
# one origin, so the httponly session cookie and OAuth redirects work exactly
# as they did when FastAPI served both.
server {
    listen 80;
    server_name _;

    # Redirects must be relative: nginx listens on 80 inside the container,
    # but the browser reaches it on the host-mapped port (8010), so an
    # absolute Location would send people to the wrong port.
    absolute_redirect off;

    # Punch-log uploads (.xlsx exports) are larger than nginx's 1 MB default.
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    location = / {
        return 302 /ui/;
    }

    location = /ui {
        return 301 /ui/;
    }

    # Content-hashed build output never changes under the same name.
    location ^~ /ui/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell must always be revalidated so a deploy is picked up at once.
    location = /ui/index.html {
        add_header Cache-Control "no-cache";
    }

    # Real files with an extension (favicon.svg, apple-touch-icon.png) are
    # served or 404 — a missing asset must not come back as the HTML shell.
    location ~ ^/ui/.+\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Client-side routes (/ui/attendance, /ui/assistant, ...) fall back to the shell.
    location /ui/ {
        try_files $uri /ui/index.html;
    }

    # Everything else is the backend. Docker's embedded DNS is re-resolved
    # through a variable, so nginx starts even before the backend exists and
    # follows it if the backend container is recreated with a new IP.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8010;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # A chat answer can wait on Groq rate-limit retries; an import can
        # take a while on a big export.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
