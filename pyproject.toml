[project]
name = "compliance-hub"
version = "0.2.0"
description = "INT Comply — a general compliance platform with pluggable agents (Meetings, Attendance, ...)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "msal",
    "itsdangerous",
    "openpyxl",
    "python-multipart",
    "python-dateutil",
    # IANA time zone data for zoneinfo (Windows and slim Docker images ship none)
    "tzdata",
    # Chat assistant: LangChain agent on Groq + HuggingFace embeddings (app/chat/)
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-huggingface>=1.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "debugpy"]
# EMBEDDINGS_MODE=local: run the embedding model on this machine instead of
# the HuggingFace Inference API (pulls in torch — large).
local-embeddings = ["sentence-transformers"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
